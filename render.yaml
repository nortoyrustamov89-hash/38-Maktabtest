services:
  - type: web
    name: 38-maktabtest
    runtime: static
    buildCommand: python build.py
    staticPublishPath: dist
    envVars:
      - key: API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
