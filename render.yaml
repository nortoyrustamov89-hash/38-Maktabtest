services:
  - type: web
    name: 38-maktabtest
    runtime: static
    buildCommand: mkdir -p dist && cp index.html dist/index.html
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
